# Compila y publica la app automáticamente en cada push a main.
#  · Web: https://abelolivalopez-sketch.github.io/verdadero-ingeniero/
#  · APK de Android (descarga directa): https://abelolivalopez-sketch.github.io/verdadero-ingeniero/descargar.html
#    (requiere una vez: Settings → Pages → Build and deployment → Source: "GitHub Actions")
#  · Windows: Actions → última ejecución → "Artifacts".
name: Compilar app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contenido:
    name: Validar contenido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml numpy
      - run: python tools/build_seed.py --check
      - run: python tools/verify_numeric.py
      - run: python tools/run_workshop_code.py

  web:
    name: Web (análisis, tests y compilación)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tools/setup_platforms.sh
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build web --release --base-href /verdadero-ingeniero/
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  publicar-web:
    name: Publicar web + APK en GitHub Pages
    needs: [web, android]
    if: ${{ !cancelled() && needs.web.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: site
      - uses: actions/download-artifact@v4
        if: ${{ needs.android.result == 'success' }}
        with:
          name: verdadero-ingeniero-android-apk
          path: apk
      - name: Añadir APK y página de descarga
        run: |
          cp tools/pages/descargar.html site/descargar.html
          if [ -f apk/app-release.apk ]; then
            cp apk/app-release.apk site/verdadero-ingeniero.apk
            ls -la site/verdadero-ingeniero.apk
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tools/setup_platforms.sh
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: verdadero-ingeniero-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: ./tools/setup_platforms.ps1
        shell: pwsh
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: verdadero-ingeniero-windows
          path: build/windows/x64/runner/Release
