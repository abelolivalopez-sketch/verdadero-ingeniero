# =====================================================================
# VERDADERO INGENIERO · Plan de estudios de 455 días (15 meses · 2 h/día)
# Cada línea de "days" es:  Título | Objetivo del día
# Todos los módulos duran un múltiplo de 7 días: los días 7, 14, 21… de cada
# módulo (y por tanto los días 7, 14, 21… del programa) son "días de
# integración" (repaso + problema o mini-proyecto).
# El número de día se asigna en orden. La app se adapta al total de días.
# =====================================================================

phases:
  - id: 1
    title: Fundamentos matemáticos y computacionales
    description: El lenguaje del ingeniero. Matemáticas, cálculo, álgebra lineal, ecuaciones diferenciales y programación científica.
  - id: 2
    title: Mecánica del ingeniero
    description: Mecánica general, teoría de máquinas y mecanismos, elasticidad y resistencia, materiales, termodinámica, motores, diseño, CAD, elementos finitos, obras y montajes.
  - id: 3
    title: Eléctrica, electrónica y mecatrónica
    description: Circuitos, electrónica, microcontroladores, Raspberry Pi, sensores, actuadores y control automático.
  - id: 4
    title: Especialización aeronáutica · Fluidos y CFD
    description: Mecánica de fluidos, aerodinámica, mecánica de vuelo y simulación CFD profesional.
  - id: 5
    title: Proyecto final integrador
    description: Diseña, calcula, simula, construye y defiende un proyecto real que integra todo lo aprendido.

modules:
  # ============================================================ FASE 1
  - id: M01
    phase: 1
    title: Matemáticas del ingeniero
    description: Unidades, estimación, álgebra, funciones, trigonometría, vectores, números complejos y geometría analítica.
    color: "#4FD1FF"
    tools: [Calculadora científica, Papel y lápiz]
    days:
      - Unidades SI, prefijos y análisis dimensional | Trabajar con el SI y comprobar ecuaciones por sus dimensiones
      - Estimación, cifras significativas y errores | Estimar órdenes de magnitud y propagar incertidumbres de medida
      - "Álgebra para ingenieros: ecuaciones y sistemas | Despejar fórmulas, resolver sistemas lineales e interpolar tablas"
      - "Funciones: potencias, exponenciales y logaritmos | Modelar crecimiento, decaimiento y usar escalas logarítmicas y dB"
      - "Trigonometría I: radianes, círculo unitario e identidades | Manejar ángulos, sinusoides e identidades trigonométricas"
      - "Trigonometría II: triángulos y descomposición de fuerzas | Aplicar teoremas del seno y del coseno a fuerzas reales"
      - "Integración semana 1: el problema de la grúa | Combinar unidades, trigonometría y sistemas en un caso real"
      - "Vectores I: componentes, módulo y vectores unitarios | Representar fuerzas y velocidades en 2D y 3D"
      - "Vectores II: producto escalar, proyecciones y trabajo | Calcular ángulos, proyecciones, trabajo y potencia"
      - "Vectores III: producto vectorial, momentos y pares | Calcular momentos de fuerzas, pares y normales a planos"
      - "Números complejos I: forma binómica, polar y Euler | Operar con complejos y usar la fórmula de Euler"
      - "Números complejos II: fasores y oscilaciones | Usar fasores para señales sinusoidales, impedancias y vibraciones"
      - Geometría analítica y sistemas de coordenadas | Rectas, planos, cónicas y coordenadas polares, cilíndricas y esféricas
      - "Integración módulo 1: examen de Matemáticas del ingeniero | Consolidar el módulo con un problema integrador de un pilón de motor"

  - id: M02
    phase: 1
    title: Cálculo en una variable
    description: Límites, derivadas, optimización, series de Taylor, integrales y sus aplicaciones mecánicas.
    color: "#4FD1FF"
    tools: [Desmos o GeoGebra, Python (opcional)]
    days:
      - Límites y continuidad | Entender límites, asíntotas, indeterminaciones y continuidad
      - "La derivada: definición e interpretación física | Ver la derivada como tasa de cambio: velocidad, pendiente, caudal"
      - Reglas de derivación y regla de la cadena | Derivar con soltura productos, cocientes y funciones compuestas
      - "Aplicaciones: optimización de diseño | Encontrar máximos y mínimos en problemas de ingeniería"
      - "Aproximaciones: linealización y series de Taylor | Aproximar funciones y acotar el error cometido"
      - "Raíces de ecuaciones: bisección y Newton-Raphson | Resolver ecuaciones no lineales numéricamente"
      - "Integración semana 3: diseño óptimo de un depósito | Optimizar material y linealizar en un caso real"
      - "La integral: áreas y acumulación | Entender la integral definida como suma acumulada y el teorema fundamental"
      - Técnicas de integración | Sustitución, integración por partes y fracciones simples
      - "Aplicaciones: centroides y momentos de inercia de área | Calcular centros de gravedad e inercias de secciones"
      - "Aplicaciones: trabajo, presión hidrostática y compuertas | Integrar fuerzas distribuidas sobre superficies"
      - "Integración numérica: trapecios y Simpson | Integrar datos experimentales y estimar el error"
      - Integrales impropias, valor medio y valor eficaz (RMS) | Calcular medias y valores eficaces de señales
      - "Integración módulo 2: examen de Cálculo | Problemas mixtos de derivadas e integrales aplicadas"

  - id: M03
    phase: 1
    title: Álgebra lineal
    description: Matrices, sistemas, determinantes, autovalores y los métodos que hay dentro de todo software de FEA y CFD.
    color: "#4FD1FF"
    tools: [Python + NumPy]
    days:
      - Matrices y operaciones | Operar con matrices y entender qué representan
      - Sistemas lineales y eliminación gaussiana | Resolver sistemas y clasificar sus soluciones
      - Determinantes y matriz inversa | Calcular e interpretar determinantes e inversas
      - Espacios vectoriales, bases y rango | Independencia lineal, base, dimensión y rango
      - "Transformaciones lineales: rotaciones y escalados | Construir matrices de rotación 2D y 3D"
      - Autovalores y autovectores | Calcularlos e interpretarlos físicamente
      - "Integración semana 5: armadura plana como sistema lineal | Plantear y resolver una estructura con matrices"
      - Diagonalización y modos propios de vibración | Obtener los modos de un sistema masa-muelle
      - Tensor de tensiones y direcciones principales | Aplicar autovalores al estado tensional
      - Ortogonalidad y mínimos cuadrados | Ajustar modelos a datos experimentales
      - Descomposiciones LU, QR y SVD | Conocer cómo resuelven los ordenadores los sistemas
      - Matrices dispersas y sistemas grandes | Entender por qué FEA y CFD generan matrices enormes y dispersas
      - "Métodos iterativos: Jacobi y Gauss-Seidel | Resolver sistemas grandes de forma iterativa"
      - "Integración módulo 3: examen de Álgebra lineal | Problemas mixtos de matrices y autovalores"

  - id: M04
    phase: 1
    title: Cálculo multivariable y vectorial
    description: Derivadas parciales, integrales múltiples y operadores vectoriales; el idioma de la mecánica de fluidos.
    color: "#4FD1FF"
    tools: [Python + Matplotlib]
    days:
      - Funciones de varias variables y derivadas parciales | Calcular derivadas parciales e interpretarlas
      - Gradiente y derivada direccional | Usar el gradiente para encontrar direcciones de máximo cambio
      - Optimización multivariable y multiplicadores de Lagrange | Optimizar con restricciones de diseño
      - "Integrales dobles: áreas, masas y centroides | Integrar sobre regiones planas"
      - Integrales triples y coordenadas cilíndricas y esféricas | Calcular volúmenes, masas e inercias de sólidos
      - Campos escalares y vectoriales | Representar campos de temperatura, presión y velocidad
      - "Integración semana 7: campo de temperaturas en una placa | Analizar un campo 2D con gradientes"
      - "Divergencia: fuentes y sumideros de un flujo | Interpretar la divergencia de un campo de velocidades"
      - "Rotacional: vorticidad y rotación de un fluido | Interpretar el rotacional como rotación local"
      - "Integrales de línea: trabajo y circulación | Calcular trabajo y circulación a lo largo de curvas"
      - Integrales de superficie y flujo a través de una superficie | Calcular caudales a través de superficies
      - Teoremas de Green, Stokes y Gauss | Relacionar integrales de volumen, superficie y línea
      - "Nabla y laplaciano: el lenguaje de la física de campos | Leer ecuaciones de campo con soltura"
      - "Integración módulo 4: examen de Cálculo vectorial | Problemas mixtos de campos y teoremas integrales"

  - id: M05
    phase: 1
    title: Ecuaciones diferenciales
    description: Modelado dinámico, vibraciones, Laplace y una primera visión de las EDP de la física.
    color: "#4FD1FF"
    tools: [Python + SciPy]
    days:
      - "Qué es una EDO: modelado de sistemas físicos | Traducir un sistema físico a una ecuación diferencial"
      - "EDO de primer orden: separables y lineales | Resolver EDO de primer orden analíticamente"
      - "Aplicaciones: enfriamiento, condensadores y vaciado de depósitos | Resolver problemas reales de primer orden"
      - EDO de segundo orden con coeficientes constantes | Resolver la homogénea y la particular
      - "Vibraciones libres: masa-muelle-amortiguador | Clasificar amortiguamiento y calcular frecuencias"
      - Vibraciones forzadas y resonancia | Calcular amplitud de respuesta y factor de amplificación
      - "Integración semana 9: suspensión de un vehículo | Modelar y dimensionar una suspensión"
      - Transformada de Laplace | Transformar y antitransformar funciones típicas
      - Funciones de transferencia y respuesta al escalón | Analizar sistemas dinámicos en el dominio s
      - Sistemas de EDO y espacio de estados | Escribir sistemas en forma matricial de estado
      - "Métodos numéricos: Euler y Runge-Kutta 4 | Integrar EDO numéricamente y comparar precisión"
      - "Introducción a las EDP: calor, onda y Laplace | Reconocer las tres EDP clásicas y su física"
      - Separación de variables y series de Fourier | Resolver la ecuación del calor 1D
      - "Integración módulo 5: examen de Ecuaciones diferenciales | Problemas mixtos de dinámica y vibraciones"

  - id: M06
    phase: 1
    title: Programación para ingenieros y métodos numéricos
    description: Python de cero a profesional, cálculo simbólico, Git, automatización de cálculos e informes y tu primer solver numérico.
    color: "#4FD1FF"
    tools: [Python, VS Code, Jupyter, Git, GitHub, NumPy, SciPy, SymPy, Matplotlib, Pandas]
    days:
      - "Entorno de trabajo: Python, VS Code y Jupyter | Dejar listo tu entorno de ingeniería"
      - "Python básico: tipos, control de flujo y funciones | Escribir scripts limpios y reutilizables"
      - Estructuras de datos y buenas prácticas | Usar listas, diccionarios y clases con criterio
      - "NumPy: arrays y vectorización | Calcular con arrays sin bucles"
      - "Matplotlib: gráficas de ingeniería | Graficar resultados de forma profesional"
      - "Pandas: análisis de datos de ensayos | Leer, limpiar y analizar datos experimentales"
      - "Integración semana 11: ensayo de tracción con Python | Obtener E, límite elástico y resistencia de datos reales"
      - "Módulos y paquetes: tu propia librería de cálculo | Organizar funciones de ingeniería reutilizables"
      - Cálculo simbólico con SymPy | Derivar, integrar y despejar fórmulas con el ordenador
      - Unidades físicas en el código con pint | Hacer imposible mezclar unidades en tus cálculos
      - "Git y GitHub: commits, ramas y colaboración | Versionar tus cálculos como un profesional"
      - "Depuración y pruebas automáticas con pytest | Garantizar que tus cálculos son correctos"
      - "Automatizar informes: Excel y PDF desde Python | Generar memorias de cálculo automáticas"
      - "Integración semana 12: calculadora de vigas con informe automático | Programa que calcula y documenta"
      - "Errores numéricos: redondeo, truncamiento y estabilidad | Entender por qué un cálculo numérico falla"
      - Interpolación y ajuste de curvas | Interpolar tablas y ajustar modelos con SciPy
      - Derivación numérica y diferencias finitas | Aproximar derivadas y estimar su orden de error
      - Resolución numérica de EDO con solve_ivp | Simular sistemas dinámicos con SciPy
      - Sistemas lineales y no lineales con SciPy | Resolver sistemas con linalg y fsolve
      - Optimización numérica con scipy.optimize | Optimizar parámetros de diseño automáticamente
      - "Integración semana 13: simulador de péndulo amortiguado | Construir y validar un simulador completo"
      - Diferencias finitas para la ecuación del calor 1D | Programar un esquema explícito
      - "Estabilidad: CFL, esquemas explícitos e implícitos | Elegir paso de tiempo y esquema"
      - "Ecuación de Laplace 2D: método iterativo | Resolver un campo potencial en una malla"
      - "Convección-difusión 1D: upwind frente a centrado | Ver la difusión numérica: el preludio de la CFD"
      - Programación orientada a objetos para simulaciones | Estructurar un código de simulación mantenible
      - "Visualización de campos: contornos y vectores | Representar campos 2D como en un post-procesador"
      - "Integración módulo 6: tu primer mini-solver | Entregar un solver documentado, probado y versionado"

  # ============================================================ FASE 2
  - id: M07
    phase: 2
    title: Mecánica general · Estática
    description: Equilibrio, estructuras, esfuerzos internos, rozamiento, centros de gravedad e inercias.
    color: "#F2B400"
    tools: [Papel y lápiz, Python]
    days:
      - Equilibrio de la partícula | Resolver equilibrios en 2D y 3D
      - Equilibrio del sólido rígido en 2D | Calcular reacciones en apoyos
      - Equilibrio en 3D y tipos de apoyo | Plantear las 6 ecuaciones de equilibrio
      - "Armaduras: método de los nudos | Calcular esfuerzos en barras"
      - "Armaduras: método de las secciones | Calcular barras concretas rápidamente"
      - Bastidores y máquinas | Analizar elementos multifuerza
      - "Integración semana 15: análisis de una grúa torre | Integrar equilibrio y estructuras"
      - Fuerzas distribuidas y cargas equivalentes | Sustituir cargas distribuidas por resultantes
      - "Diagramas de esfuerzos: axil, cortante y flector | Dibujar diagramas N, V y M"
      - "Rozamiento aplicado: cuñas, tornillos y correas | Resolver mecanismos con rozamiento"
      - Centros de gravedad de cuerpos compuestos | Calcular centroides por partes
      - Momentos de inercia y teorema de Steiner | Calcular inercias de perfiles
      - Trabajo virtual | Resolver mecanismos por energía
      - "Integración módulo 7: examen de Estática | Problemas mixtos de estática"

  - id: M08
    phase: 2
    title: Mecánica general · Dinámica
    description: Cinemática, dinámica de la partícula y del sólido rígido, energía, cantidad de movimiento y gravitación.
    color: "#F2B400"
    tools: [Python, Papel y lápiz]
    days:
      - Cinemática de la partícula | Relacionar posición, velocidad y aceleración
      - "Movimiento curvilíneo: componentes intrínsecas y polares | Describir trayectorias curvas"
      - Leyes de Newton y diagramas de cuerpo libre | Dibujar DCL correctos y plantear ecuaciones
      - Rozamiento y planos inclinados en dinámica | Resolver problemas con rozamiento estático y dinámico
      - Trabajo, energía y potencia | Aplicar el teorema de la energía
      - Impulso, cantidad de movimiento y choques | Resolver choques e impulsos
      - "Integración semana 17: aceleración y frenado de un vehículo | Integrar dinámica y energía"
      - Sistemas de partículas y centro de masas | Aplicar Newton a sistemas
      - Cinemática del sólido rígido | Velocidades y aceleraciones de puntos de un sólido
      - "Dinámica de rotación: momento de inercia y par | Aplicar ΣM = Iα"
      - Energía y momento angular del sólido rígido | Usar conservación en rotación
      - "Movimiento plano general: rodadura | Resolver ruedas, poleas y cilindros rodando"
      - Gravitación y movimiento orbital básico | Calcular órbitas circulares y velocidad de escape
      - "Integración módulo 8: examen de Dinámica | Problemas mixtos de dinámica"

  - id: M09
    phase: 2
    title: Teoría de máquinas y mecanismos
    description: Mecanismos, movimiento relativo y Coriolis, análisis de posición, velocidad y aceleración, levas, engranajes, trenes epicicloidales, dinámica de máquinas, volantes y equilibrado.
    color: "#F2B400"
    tools: [Python, GeoGebra, Linkage o SAM, SolidWorks Motion]
    days:
      - "Máquinas y mecanismos: eslabones, pares cinemáticos y cadenas | Describir cualquier mecanismo con su vocabulario técnico"
      - "Grados de libertad: criterio de Grübler-Kutzbach | Calcular la movilidad de un mecanismo"
      - "Cuadrilátero articulado y ley de Grashof | Predecir si un eslabón puede dar vueltas completas"
      - Mecanismo biela-manivela e inversiones | Analizar el corazón de un motor alternativo
      - "Análisis de posición: métodos gráfico y analítico | Resolver la posición de un mecanismo"
      - "Movimiento relativo I: velocidades en sistemas de referencia móviles | Componer velocidades absolutas, relativas y de arrastre"
      - "Integración semana 19: programa la posición de un cuadrilátero en Python | Simular la geometría de un mecanismo"
      - "Movimiento relativo II: aceleración de arrastre y de Coriolis | Calcular aceleraciones en guías móviles"
      - "Análisis de velocidades: polígonos de velocidades | Obtener velocidades de todos los puntos"
      - "Centros instantáneos de rotación y teorema de Kennedy | Hallar velocidades de forma rápida"
      - "Análisis de aceleraciones: polígono de aceleraciones | Obtener aceleraciones de todos los puntos"
      - Análisis cinemático con números complejos (método de Raven) | Resolver mecanismos de forma analítica y programable
      - Simulación cinemática completa en Python | Obtener curvas de posición, velocidad y aceleración
      - "Integración semana 20: cinemática del pistón de un motor | Velocidad y aceleración del pistón en todo el ciclo"
      - "Síntesis de mecanismos: generación de trayectorias y funciones | Diseñar un mecanismo para un movimiento dado"
      - "Levas y seguidores: leyes de desplazamiento | Elegir leyes de movimiento sin choques"
      - Diseño del perfil de una leva | Trazar y comprobar el perfil
      - "Engranajes: ley fundamental y perfil de evolvente | Entender por qué los dientes tienen esa forma"
      - Trenes de engranajes ordinarios | Calcular relaciones de transmisión
      - "Trenes epicicloidales: fórmula de Willis | Resolver reductores planetarios y diferenciales"
      - "Integración semana 21: caja reductora planetaria | Calcular velocidades y pares de un planetario"
      - "Dinámica de máquinas: análisis de fuerzas en mecanismos | Calcular reacciones en pares y par motor"
      - Potencias virtuales y par equilibrante | Resolver la dinámica con un balance de potencias
      - Volantes de inercia y grado de irregularidad | Dimensionar un volante
      - "Equilibrado de rotores: estático y dinámico | Calcular masas de equilibrado"
      - Equilibrado de motores alternativos | Analizar fuerzas de inercia de primer y segundo orden
      - Velocidades críticas de ejes y vibraciones en máquinas | Evitar la resonancia de ejes
      - "Integración módulo 9: examen de Teoría de máquinas | Problemas mixtos de mecanismos"

  - id: M10
    phase: 2
    title: Elasticidad y resistencia de materiales
    description: Tensiones, deformaciones, teoría de la elasticidad, flexión, torsión, pandeo, fatiga y criterios de fallo.
    color: "#F2B400"
    tools: [Python, Prontuario de vigas]
    days:
      - Tensión y deformación | Definir tensión normal, cortante y deformación
      - Ley de Hooke, Poisson y diagrama tensión-deformación | Leer un ensayo y usar las constantes elásticas
      - "Carga axial: alargamientos e hiperestáticos | Resolver barras con carga axial"
      - Tensiones térmicas | Calcular tensiones por dilatación impedida
      - Torsión de ejes circulares | Calcular tensión tangencial y giro
      - Transmisión de potencia por ejes | Relacionar par, potencia y rpm
      - "Integración semana 23: dimensionado de un eje de transmisión | Dimensionar un eje real"
      - "Flexión: tensiones normales en vigas | Aplicar σ = M·y/I"
      - Tensiones cortantes en vigas | Aplicar la fórmula de Collignon
      - "Deflexión de vigas: ecuación de la elástica | Calcular flechas y giros"
      - Superposición y vigas hiperestáticas | Resolver vigas con apoyos redundantes
      - Transformación de tensiones y círculo de Mohr | Encontrar tensiones principales
      - Tensiones combinadas | Combinar axil, flexión y torsión
      - "Integración semana 24: larguero de un ala a flexión | Dimensionar un larguero"
      - "Teoría de la elasticidad: tensor de tensiones y equilibrio interno | Escribir el estado tensional completo"
      - Tensor de deformaciones y ecuaciones de compatibilidad | Relacionar desplazamientos y deformaciones
      - "Ley de Hooke generalizada: E, G, ν y K | Pasar de tensiones a deformaciones en 3D"
      - Tensión plana y deformación plana | Simplificar problemas 3D a 2D
      - "Cilindros de pared gruesa y ajustes a presión (Lamé) | Calcular tensiones en ajustes eje-buje"
      - "Energía de deformación y teoremas de Castigliano | Calcular desplazamientos por energía"
      - "Integración semana 25: ajuste a presión de un buje sobre un eje | Calcular apriete, tensiones y par transmisible"
      - "Criterios de fallo: von Mises y Tresca | Predecir fluencia en estados complejos"
      - Pandeo de columnas (Euler y Johnson) | Calcular cargas críticas
      - Concentración de tensiones | Usar factores Kt
      - "Fatiga: curvas S-N y criterio de Goodman | Estimar vida a fatiga"
      - Recipientes a presión de pared delgada | Calcular tensiones circunferenciales y axiales
      - Introducción a la plasticidad y la mecánica de la fractura | Saber cuándo falla una pieza con grietas
      - "Integración módulo 10: examen de Elasticidad y resistencia | Problemas mixtos de resistencia"

  - id: M11
    phase: 2
    title: Ciencia de materiales y fabricación
    description: Metales, polímeros, compuestos, tratamientos, selección de materiales y procesos de fabricación.
    color: "#F2B400"
    tools: [Diagramas de Ashby, Impresora 3D (opcional)]
    days:
      - Estructura atómica y cristalina de los metales | Relacionar estructura y propiedades
      - Propiedades mecánicas y ensayos | Interpretar tracción, dureza e impacto
      - "Diagramas de fase: el sistema hierro-carbono | Leer el diagrama Fe-C"
      - Tratamientos térmicos de aceros | Elegir temple, revenido o recocido
      - Aleaciones de aluminio y titanio en aeronáutica | Conocer las aleaciones aeroespaciales clave
      - Polímeros y plásticos técnicos | Elegir plásticos para piezas funcionales
      - "Integración semana 27: selección de material para un soporte | Justificar una elección de material"
      - "Materiales compuestos: fibra de carbono y laminados | Entender laminados y su anisotropía"
      - "Selección de materiales: diagramas de Ashby | Usar índices de material"
      - "Procesos de fabricación: mecanizado | Conocer torneado, fresado y parámetros de corte"
      - Conformado, fundición y soldadura | Elegir el proceso adecuado
      - "Fabricación aditiva: FDM, SLA y metal | Diseñar para impresión 3D"
      - Tolerancias, ajustes y metrología | Especificar ajustes ISO y medir
      - "Integración módulo 11: examen de Materiales y fabricación | Problemas mixtos de materiales"

  - id: M12
    phase: 2
    title: Termodinámica y transferencia de calor
    description: Primer y segundo principio, ciclos (incluido Brayton de los motores a reacción) y transmisión de calor.
    color: "#F2B400"
    tools: [Tablas de vapor, CoolProp (Python)]
    days:
      - "Conceptos básicos: sistema, estado y propiedades | Definir sistemas y propiedades termodinámicas"
      - Primer principio en sistemas cerrados | Aplicar balances de energía
      - Sustancias puras y tablas de vapor | Usar tablas y diagramas de fase
      - Gas ideal y procesos | Calcular procesos isotermos, isobaros y adiabáticos
      - Primer principio en volúmenes de control | Analizar toberas, turbinas y compresores
      - Segundo principio y entropía | Evaluar irreversibilidades
