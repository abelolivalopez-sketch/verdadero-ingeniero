      - "Definición del proyecto: necesidad, requisitos y alcance | Fijar qué vas a construir y por qué"
      - Planificación, presupuesto y riesgos | Hacer el Gantt y el presupuesto del proyecto
      - Diseño conceptual y matriz de decisión | Elegir el concepto con criterios objetivos
      - Cálculos preliminares a mano | Prediseñar con las fórmulas del programa
      - Mecanismos y cinemática del diseño | Analizar el movimiento de las partes móviles
      - CAD detallado | Modelar el diseño completo
      - "Integración semana 64: revisión de diseño preliminar (PDR) | Defender el diseño ante un revisor"
      - Simulación CFD del componente | Obtener cargas aerodinámicas o hidrodinámicas
      - Simulación estructural por MEF | Validar resistencia y rigidez
      - "Electrónica y control: banco de ensayo con Raspberry Pi | Instrumentar el ensayo"
      - Planos de fabricación y plan de montaje | Preparar fabricación y montaje
      - Fabricación, montaje y puesta a punto | Construir el prototipo
      - Ensayos y comparación con la simulación | Validar el diseño con datos reales
      - "Defensa final: memoria técnica y retrospectiva | Defender el proyecto: ¡Verdadero Ingeniero!"
